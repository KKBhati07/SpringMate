<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
        }
        .email-header {
            background-color: rgb(0, 131, 176);
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .email-header h2 {
            margin: 0;
        }
        .email-body {
            padding: 30px 20px;
            color: #333333;
        }
        .otp-box {
            background-color: #f2f9fc;
            border: 2px dashed rgb(0, 131, 176);
            color: rgb(0, 131, 176);
            font-size: 28px;
            font-weight: bold;
            padding: 15px;
            text-align: center;
            margin: 20px 0;
            letter-spacing: 4px;
            border-radius: 6px;
        }
        .footer {
            font-size: 12px;
            text-align: center;
            color: #888;
            padding: 10px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h2 th:text="${heading}">Email Verification</h2>
    </div>
    <div class="email-body">
        <p>Hello,</p>
        <p>Your One-Time Password (OTP) for verification is:</p>

        <div class="otp-box">
            <span th:text="${otp}">123456</span>
        </div>

        <p>This OTP is valid for the next <strong>10 minutes</strong>.</p>
        <p>If you did not request this, please ignore this email.</p>

        <p>Regards,<br><strong>Team MarketMate</strong></p>
    </div>
    <div class="footer">
        &copy; 2025 MarketMate. All rights reserved.
    </div>
</div>
</body>
</html>
