spring:
  application:
    seed-secret: ${SEED_SECRET}
    location-api-key: ${LOCATION_API_KEY:api-key}
    name: springmate  # Sets the name of the Spring Boot application. Useful for identification in logs and admin tools.

  web:
    resources:
      add-mappings: false # Disable static resources

  mvc:
    throw-exception-if-no-handler-found: true   # Throw NoHandlerFoundException for unknown routes

  datasource:
    url: ${DB_URL} # JDBC URL to connect to the PostgreSQL database
    username: ${DB_USERNAME}  # Database username
    password: ${DB_PASSWORD}  # Database password
    driver-class-name: org.postgresql.Driver  # PostgreSQL JDBC driver class

  jackson:
    property-naming-strategy: SNAKE_CASE

  jpa:
    hibernate:
      ddl-auto: update  # Automatically updates the database schema. OK for dev.
    # database-platform: org.hibernate.dialect.PostgreSQLDialect  # Uncomment and fix if needed

  mail: # Configuration specific to Spring's Mail support
    host: smtp.gmail.com                  # SMTP server host (Gmail's SMTP server)
    port: 587                             # Port for TLS/STARTTLS (Gmail requires 587)
    username: ${EMAIL_USERNAME}           # Email username (injected via environment variable or .env)
    password: ${EMAIL_PASSWORD}           # Email password or App Password (also from env or .env)
    properties: # Additional mail-specific properties
      mail: # Nesting for standard JavaMail properties
        smtp: # SMTP-specific configuration
          auth: true                      # Enables SMTP authentication
          starttls: # STARTTLS encryption config
            enable: true                  # Enables STARTTLS (encryption over port 587)
        debug: true                       # Enables detailed logging of the email sending process

resilience4j:
  retry:
    instances:
      s3Upload:
        max-attempts: 3               # Number of retry attempts (1 initial + 2 retries)
        wait-duration: 1s            # Wait duration between retry attempts
      sendEmail:
        max-attempts: 3               # Number of retry attempts (1 initial + 2 retries)
        wait-duration: 1s            # Wait duration between retry attempts
  circuitbreaker:
    instances:
      s3Upload:
        register-health-indicator: true     # Exposes circuit breaker metrics to actuator
        sliding-window-size: 5              # Number of calls to consider for calculating failure rate
        minimum-number-of-calls: 5          # Minimum number of calls required before calculating failure rate
        failure-rate-threshold: 50          # Percentage of failures to trip the circuit
        wait-duration-in-open-state: 10s    # Time to wait before transitioning from OPEN to HALF_OPEN
      sendEmail:
        register-health-indicator: true     # Exposes circuit breaker metrics to actuator
        sliding-window-size: 5              # Number of calls to consider for calculating failure rate
        minimum-number-of-calls: 5          # Minimum number of calls required before calculating failure rate
        failure-rate-threshold: 50          # Percentage of failures to trip the circuit
        wait-duration-in-open-state: 10s    # Time to wait before transitioning from OPEN to HALF_OPEN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers,httptrace
        exclude: shutdown,heapdump,threaddump
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

app:
  monitoring:
    prometheus:
      username: prometheus
      password: ${PROMETHEUS_PASS:prometheus-pass}
  # AWS S3 Configuration
  aws:
    region: ${AWS_REGION:ap-south-1}
    bucket-name: ${AWS_BUCKET_NAME:marketmatestore}
    presign:
      get-expiry-minutes: ${AWS_GET_URL_EXPIRY:10}     # Expiration for GET presigned URLs (minutes)
      put-expiry-minutes: ${AWS_PUT_URL_EXPIRY:15}     # Expiration for PUT presigned URLs (minutes)

  # CORS Configuration (profile-specific values in application-{profile}.yml)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age-seconds: 3600

  # Cookie Configuration
  cookie:
    domain: ${COOKIE_DOMAIN:.localhost}
    secure: ${COOKIE_SECURE:true}
    path: /

  # Authentication Configuration
  auth:
    jwt:
      secret: ${JWT_SECRET}                            # JWT signing secret (required)
      validity-days: ${JWT_VALIDITY_DAYS:7}            # JWT token validity in days
    session:
      validity-days: ${SESSION_VALIDITY_DAYS:7}        # Session validity in days
    otp:
      expiration-minutes: ${OTP_EXPIRATION_MINUTES:10} # OTP expiration in minutes
